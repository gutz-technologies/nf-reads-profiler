AWSTemplateFormatVersion: '2010-09-09'
Description: >
  AWS Batch infrastructure for nf-reads-profiler Nextflow pipeline.
  Creates IAM roles, Graviton (ARM64) compute environments, job queue,
  S3 buckets, CloudWatch monitoring, and AWS Budget alerts.

  Bucket ownership:
    WorkDirBucketName  — Nextflow intermediate files; managed by this stack,
                         deleted on teardown (after manual emptying).
    RunsBucketName     — Pre-existing bucket for samplesheets and results;
                         referenced in IAM policies only, NOT created by this stack.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC for Batch compute environments (use default VPC or custom)

  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: >
      Subnets for Batch compute instances. Use public subnets with auto-assign
      public IP, or private subnets with NAT gateway (required for DockerHub pulls).

  WorkDirBucketName:
    Type: String
    Default: gutz-nf-reads-profilers-workdir
    Description: >
      S3 bucket for Nextflow intermediate work files. Managed by this stack —
      deleted when the stack is deleted (after you empty it first).
      A 30-day lifecycle rule is applied automatically.
      If this bucket already exists, import it: see readme for instructions.

  RunsBucketName:
    Type: String
    Default: gutz-nf-reads-profilers-runs
    Description: >
      Pre-existing S3 bucket for samplesheets (input) and pipeline results (output).
      This bucket is NOT created or deleted by this stack — it is only referenced
      in IAM policies so Batch jobs can read/write to it.

  SpotBidPercentage:
    Type: Number
    Default: 50
    MinValue: 1
    MaxValue: 100
    Description: >
      Spot bid as % of full on-demand price. This is a maximum price. We actually pay
      the current spot price, which is often much lower than the bid!

  MaxvCPUsSpot:
    Type: Number
    Default: 256
    Description: Maximum vCPUs across all spot instances (controls pipeline parallelism)

  MaxvCPUsOnDemand:
    Type: Number
    Default: 0
    Description: Maximum vCPUs for on-demand fallback (cost safety net)

  MaxvCPUsMetaphlan:
    Type: Number
    Default: 100
    Description: >
      Maximum vCPUs for the spot-metaphlan compute environment (profile_taxa +
      StrainPhlAn). Spot-only; no on-demand fallback. Capped just above one
      r8g.metal-24xl (96 vCPU) so Batch can launch exactly one bare-metal VM
      and no second one (192 > 100).

  MaxvCPUsHumann:
    Type: Number
    Default: 600
    Description: >
      Maximum vCPUs for the spot-humann compute environment (profile_function).
      Spot-only; no on-demand fallback. profile_function is the long-pole of a
      full run, so this is sized for several bare-metal boxes in parallel: 600
      vCPU = up to ~3x c8g.metal-48xl (192) or ~6x *.metal-24xl (96), i.e.
      ~36 concurrent HUMAnN jobs (16 cpus each). Measured ~45 min/job, so this
      clears a 2098-sample cohort in <2 days vs ~11 days on a single box.

  # MonthlyBudgetThreshold + BudgetAlertEmail moved to infra/monitoring-stack.yaml
  # (budget, SNS topic, and alarms live there now).

  ProjectTag:
    Type: String
    Default: nf-reads-profiler
    Description: Value for Project cost-allocation tag applied to all resources

  EnvironmentTag:
    Type: String
    Default: development
    AllowedValues: [production, staging, development]
    Description: Value for Environment tag applied to all resources

  EcsAmiId:
    Type: AWS::EC2::Image::Id
    Description: >
      Custom pre-baked AMI for Batch workers. Built by infra/packer/build-ami.sh
      from the AL2023 ECS-optimized ARM64 base, with databases (~65 GiB) and
      Miniconda/awscli pre-installed at /mnt/dbs/ and /opt/conda-aws/.
      Look up the current AMI with:
        aws ssm get-parameter --name /nf-reads-profiler/ami-id --region us-east-2 --query 'Parameter.Value' --output text

  DbSourceBucket:
    Type: String
    Default: cjb-gutz-s3-demo
    Description: >
      S3 bucket that holds the metaomics databases (MetaPhlAn, HUMAnN4,
      ChocoPhlAn, UniRef). Databases are pre-baked into the custom AMI;
      this parameter is used only for IAM policy permissions.
      The EcsInstanceRole is granted read-only access to this bucket.
      This bucket is NOT created or deleted by this stack.

  ThinEcsAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ecs/optimized-ami/amazon-linux-2023/arm64/recommended/image_id
    Description: >
      Stock AL2023 ECS-optimized ARM64 AMI for the per-database queues
      (spot-metaphlan, etc.). Resolved from the AWS public SSM parameter so it is
      always current — no Packer rebuild. Unlike EcsAmiId this AMI bakes NO
      databases and NO awscli; the queue's launch-template UserData installs
      awscli to /opt/conda-aws/bin and copies its database from S3 at boot.

  MetaphlanDbS3Uri:
    Type: String
    Default: s3://cjb-gutz-s3-demo/metaphlan_databases/vJan25/
    Description: >
      S3 prefix of the MetaPhlAn vJan25 database (~44 GB), copied to
      /mnt/dbs/metaphlan_databases/vJan25/ at boot by the spot-metaphlan worker.
      Must match direct_metaphlan_db in conf/aws_batch.config.

# ---------------------------------------------------------------------------
# S3
# ---------------------------------------------------------------------------
Resources:

  # Work directory: Nextflow intermediate task files.
  # Managed by this stack — deleted when the stack is torn down.
  # Lifecycle rule auto-expires objects after 30 days, keeping costs low
  # and ensuring the bucket is nearly empty by teardown time.
  S3WorkDirBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref WorkDirBucketName
      LifecycleConfiguration:
        Rules:
          - Id: expire-work-files-30-days
            Status: Enabled
            ExpirationInDays: 30
            NoncurrentVersionExpiration:
              NoncurrentDays: 7
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 3
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Environment
          Value: !Ref EnvironmentTag

  # Runs bucket (gutz-nf-reads-profilers-runs) is pre-existing and externally managed.
  # It is NOT created by this stack. IAM policies below reference it by name.

# ---------------------------------------------------------------------------
# ECR
# ---------------------------------------------------------------------------

  EcrMetaphlan:
    Type: AWS::ECR::Repository
    DependsOn: NextflowRunnerPolicy
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: metaphlan
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Environment
          Value: !Ref EnvironmentTag

  EcrAwsCliBash:
    Type: AWS::ECR::Repository
    DependsOn: NextflowRunnerPolicy
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: aws-cli-bash
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Environment
          Value: !Ref EnvironmentTag

  EcrSraToolsBash:
    Type: AWS::ECR::Repository
    DependsOn: NextflowRunnerPolicy
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: sra-tools-bash
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Environment
          Value: !Ref EnvironmentTag

  EcrMedi:
    Type: AWS::ECR::Repository
    DependsOn: NextflowRunnerPolicy
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: medi
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Environment
          Value: !Ref EnvironmentTag

  EcrHumann:
    Type: AWS::ECR::Repository
    DependsOn: NextflowRunnerPolicy
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: humann
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Environment
          Value: !Ref EnvironmentTag

  EcrFastp:
    Type: AWS::ECR::Repository
    DependsOn: NextflowRunnerPolicy
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: fastp
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Environment
          Value: !Ref EnvironmentTag

  EcrMultiqc:
    Type: AWS::ECR::Repository
    DependsOn: NextflowRunnerPolicy
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: multiqc
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Environment
          Value: !Ref EnvironmentTag

# ---------------------------------------------------------------------------
# IAM
# ---------------------------------------------------------------------------

  # Batch service role — allows AWS Batch to call EC2/ECS on your behalf
  BatchServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectTag}-batch-service-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: batch.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSBatchServiceRole
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Environment
          Value: !Ref EnvironmentTag

  # EC2 instance role — assumed by the ECS agent on each Batch compute instance
  EcsInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectTag}-ecs-instance-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonEC2ContainerServiceforEC2Role
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: S3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource:
                  - !GetAtt S3WorkDirBucket.Arn
                  - !Sub "${S3WorkDirBucket.Arn}/*"
                  - !Sub "arn:aws:s3:::${RunsBucketName}"
                  - !Sub "arn:aws:s3:::${RunsBucketName}/*"
                  # Database bucket
                  - !Sub "arn:aws:s3:::${DbSourceBucket}"
                  - !Sub "arn:aws:s3:::${DbSourceBucket}/*"
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Environment
          Value: !Ref EnvironmentTag

  EcsInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub "${ProjectTag}-ecs-instance-profile"
      Roles:
        - !Ref EcsInstanceRole

  # Job role — assumed by containers themselves (ECS task role).
  # Nextflow passes this as jobRoleArn when registering job definitions.
  BatchJobRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectTag}-batch-job-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: S3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource:
                  - !GetAtt S3WorkDirBucket.Arn
                  - !Sub "${S3WorkDirBucket.Arn}/*"
                  - !Sub "arn:aws:s3:::${RunsBucketName}"
                  - !Sub "arn:aws:s3:::${RunsBucketName}/*"
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource:
                  - arn:aws:s3:::gutz-data-globus
                  - arn:aws:s3:::gutz-data-globus/*
        - PolicyName: CloudWatchLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogStreams
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/batch/*"
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Environment
          Value: !Ref EnvironmentTag

  # Spot fleet role — required for SPOT allocation strategy
  SpotFleetRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectTag}-spot-fleet-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: spotfleet.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonEC2SpotFleetTaggingRole
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Environment
          Value: !Ref EnvironmentTag

  # Managed policy to attach to the EC2 Nextflow runner's existing IAM role.
  # After deploying: aws iam attach-role-policy --policy-arn <NextflowRunnerPolicyArn output>
  NextflowRunnerPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${ProjectTag}-nextflow-runner-policy"
      Description: "Grants an EC2 Nextflow runner VM the minimum permissions to submit and monitor AWS Batch jobs and read/write both S3 buckets."
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: BatchSubmitAndMonitor
            Effect: Allow
            Action:
              - batch:SubmitJob
              - batch:DescribeJobs
              - batch:CancelJob
              - batch:TerminateJob
              - batch:ListJobs
              - batch:RegisterJobDefinition
              - batch:DeregisterJobDefinition
              - batch:DescribeJobDefinitions
              - batch:DescribeJobQueues
              - batch:DescribeComputeEnvironments
            Resource: '*'
          - Sid: S3Access
            Effect: Allow
            Action: s3:*
            Resource:
              - !GetAtt S3WorkDirBucket.Arn
              - !Sub "${S3WorkDirBucket.Arn}/*"
              - !Sub "arn:aws:s3:::${RunsBucketName}"
              - !Sub "arn:aws:s3:::${RunsBucketName}/*"
          - Sid: CloudWatchLogs
            Effect: Allow
            Action:
              - logs:GetLogEvents
              - logs:DescribeLogStreams
              - logs:DescribeLogGroups
            Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/batch/*"
          - Sid: PassJobRole
            Effect: Allow
            Action: iam:PassRole
            Resource: !GetAtt BatchJobRole.Arn
            Condition:
              StringEquals:
                iam:PassedToService: ecs-tasks.amazonaws.com
          - Sid: PassLambdaRole
            Effect: Allow
            Action: iam:PassRole
            # Both metrics lambdas live in monitoring-stack.yaml now; match by
            # name pattern so the runner can (re)deploy that stack.
            Resource: !Sub "arn:aws:iam::${AWS::AccountId}:role/${ProjectTag}-*-lambda-role"
            Condition:
              StringEquals:
                iam:PassedToService: lambda.amazonaws.com
          - Sid: LambdaDeploy
            Effect: Allow
            Action:
              - lambda:CreateFunction
              - lambda:GetFunction
              - lambda:UpdateFunctionCode
              - lambda:UpdateFunctionConfiguration
              - lambda:DeleteFunction
              - lambda:AddPermission
              - lambda:RemovePermission
              - lambda:GetPolicy
              - lambda:ListTags
              - lambda:TagResource
              - lambda:UntagResource
            Resource: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${ProjectTag}-*"
          - Sid: EventBridgeDeploy
            Effect: Allow
            Action:
              - events:PutRule
              - events:DescribeRule
              - events:DeleteRule
              - events:PutTargets
              - events:RemoveTargets
              - events:ListTargetsByRule
            Resource: !Sub "arn:aws:events:${AWS::Region}:${AWS::AccountId}:rule/${ProjectTag}-*"
          - Sid: ECRPushPull
            Effect: Allow
            Action:
              - ecr:GetAuthorizationToken
              - ecr:CreateRepository
              - ecr:DescribeRepositories
              - ecr:GetRepositoryPolicy
              - ecr:BatchCheckLayerAvailability
              - ecr:InitiateLayerUpload
              - ecr:UploadLayerPart
              - ecr:CompleteLayerUpload
              - ecr:PutImage
              - ecr:GetDownloadUrlForLayer
              - ecr:BatchGetImage
              - ecr:TagResource
            Resource: '*'

# ---------------------------------------------------------------------------
# Networking
# ---------------------------------------------------------------------------

  BatchComputeSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "${ProjectTag}-batch-compute-sg"
      GroupDescription: "Security group for AWS Batch compute instances - no inbound required, instances pull containers and data from S3 outbound."
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 0.0.0.0/0
          Description: All outbound (DockerHub pulls, S3, AWS APIs)
      Tags:
        - Key: Name
          Value: !Sub "${ProjectTag}-batch-compute-sg"
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Environment
          Value: !Ref EnvironmentTag

# ---------------------------------------------------------------------------
# Launch Template — thin stock AMI, awscli only (spot-queue + on-demand glue)
# ---------------------------------------------------------------------------
# spot-queue carries only DB-free glue jobs (count_reads, clean_reads, combines,
# multiqc, SRA ingest) — none read /mnt/dbs. So this no longer uses the baked-DB
# custom AMI (no DBs to stage => no FSR, no Packer rebuild). Stock AL2023 ECS
# ARM64 AMI (ThinEcsAmiId); UserData only installs awscli v2 to
# /opt/conda-aws/bin (the GLOBAL aws.batch.cliPath; Nextflow bind-mounts the
# grandparent /opt/conda-aws into every container, so this path must exist on
# the host for any job to stage inputs from the S3 workdir).

  BatchWorkerLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub "${ProjectTag}-worker"
      LaunchTemplateData:
        ImageId: !Ref ThinEcsAmiId
        # 500 GB gp3 root volume. AL2023 ECS-optimized defaults to 30 GB, which
        # is exhausted by fasterq-dump scratch + pigz output on medium SRA runs.
        # No DBs live here anymore (thin AMI); sized purely for SRA ingest scratch.
        # Volume is deleted on instance termination; cost is ~$0.055/hr while
        # a worker is running, $0 once the fleet scales to zero.
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              VolumeSize: 500
              VolumeType: gp3
              Iops: 9000            # 3x default (3000→9000); gp3 max is 16000
              Throughput: 1000      # gp3 max; default is only 125 MB/s — speeds fasterq-dump scratch writes
              DeleteOnTermination: true
              Encrypted: true
        UserData:
          Fn::Base64: |
            MIME-Version: 1.0
            Content-Type: multipart/mixed; boundary="==BOUNDARY=="

            --==BOUNDARY==
            Content-Type: text/x-shellscript; charset="us-ascii"

            #!/bin/bash
            exec > >(tee -a /var/log/nf-userdata.log) 2>&1
            set -x
            echo "=== nf-reads-profiler glue worker boot at $(date) ==="

            # awscli v2 → /opt/conda-aws/bin/aws (global cliPath; bind-mounted
            # grandparent /opt/conda-aws must exist for every container). No DB
            # staging — glue jobs read nothing from /mnt/dbs.
            AWS=/opt/conda-aws/bin/aws
            if [ ! -x "$AWS" ]; then
              echo "=== Installing awscli v2 to /opt/conda-aws ==="
              dnf install -y unzip >/dev/null 2>&1 || yum install -y unzip
              cd /tmp
              curl -sSL "https://awscli.amazonaws.com/awscli-exe-linux-aarch64.zip" -o awscliv2.zip
              unzip -q awscliv2.zip
              ./aws/install --install-dir /opt/conda-aws/aws-cli --bin-dir /opt/conda-aws/bin
              rm -rf awscliv2.zip aws
            fi
            "$AWS" --version || { echo "FATAL: awscli install failed" >&2; exit 1; }

            echo "=== nf-reads-profiler glue worker boot done at $(date) ==="

            --==BOUNDARY==--

# ---------------------------------------------------------------------------
# Launch Template — thin stock AMI, copies vJan25 from S3 at boot (spot-metaphlan)
# ---------------------------------------------------------------------------
# Uses the stock AL2023 ECS ARM64 AMI (ThinEcsAmiId) — NO baked databases, NO
# baked awscli. UserData, run SYNCHRONOUSLY so ECS registration is gated until
# it finishes (an instance accepts no Batch jobs until vJan25 is present):
#   1. install awscli v2 to /opt/conda-aws/bin (the GLOBAL aws.batch.cliPath;
#      Nextflow bind-mounts the grandparent /opt/conda-aws into every container,
#      so this path must exist on the host for any job to stage inputs).
#   2. aws s3 cp --recursive the vJan25 DB to /mnt/dbs/metaphlan_databases/vJan25/.
# One copy per instance (~3–5 min for ~44 GB), amortized over every profile_taxa
# / StrainPhlAn job that lands on it. No FSR, no Packer rebuild. See
# infra/multiqueue-design.md.

  MetaphlanWorkerLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub "${ProjectTag}-metaphlan-worker"
      LaunchTemplateData:
        ImageId: !Ref ThinEcsAmiId
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              VolumeSize: 200          # vJan25 ~44 GB + MetaPhlAn scratch; far less than the 500 GB ingest worker
              VolumeType: gp3
              Iops: 9000
              Throughput: 1000         # gp3 max; default 125 MB/s pins the boot-time vJan25 S3 sync
              DeleteOnTermination: true
              Encrypted: true
        UserData:
          Fn::Base64: !Sub |
            MIME-Version: 1.0
            Content-Type: multipart/mixed; boundary="==BOUNDARY=="

            --==BOUNDARY==
            Content-Type: text/x-shellscript; charset="us-ascii"

            #!/bin/bash
            exec > >(tee -a /var/log/nf-userdata.log) 2>&1
            set -x
            echo "=== spot-metaphlan worker boot at $(date) ==="

            # 1. awscli v2 → /opt/conda-aws/bin/aws (global cliPath; bind-mounted
            #    grandparent /opt/conda-aws must exist for every container).
            AWS=/opt/conda-aws/bin/aws
            if [ ! -x "$AWS" ]; then
              echo "=== Installing awscli v2 to /opt/conda-aws ==="
              dnf install -y unzip >/dev/null 2>&1 || yum install -y unzip
              cd /tmp
              curl -sSL "https://awscli.amazonaws.com/awscli-exe-linux-aarch64.zip" -o awscliv2.zip
              unzip -q awscliv2.zip
              ./aws/install --install-dir /opt/conda-aws/aws-cli --bin-dir /opt/conda-aws/bin
              rm -rf awscliv2.zip aws
            fi
            "$AWS" --version || { echo "FATAL: awscli install failed" >&2; exit 1; }

            # 2. Copy vJan25 from S3 (SYNCHRONOUS — gates ECS registration).
            # Skip the *_SGB.fna / *_SGB.fna.bz2 source sequences (~7.4 GB): they
            # build the .bt2l index at `metaphlan --install` time and are NOT read
            # at profiling time (the known-good local install ships neither).
            # NOTE: if StrainPhlAn Pass-2 extract_markers ever needs _SGB.fna,
            # drop these --exclude flags.
            DEST=/mnt/dbs/metaphlan_databases/vJan25
            mkdir -p "$DEST"
            # Raise S3 parallelism to match the gp3 Throughput bump (1000 MB/s).
            "$AWS" configure set default.s3.max_concurrent_requests 128
            "$AWS" configure set default.s3.max_queue_size 10000
            echo "=== Copying ${MetaphlanDbS3Uri} -> $DEST (excluding _SGB.fna*) ==="
            if ! time "$AWS" s3 cp --recursive --only-show-errors \
                 --exclude "*_SGB.fna" --exclude "*_SGB.fna.bz2" \
                 "${MetaphlanDbS3Uri}" "$DEST/"; then
              echo "FATAL: vJan25 copy failed — worker will not be useful" >&2
              exit 1
            fi
            echo "OK: vJan25 present ($(du -sh "$DEST" | cut -f1))"

            # 3. btop (monitoring; non-essential, don't fail boot on it).
            echo "=== Installing btop ==="
            dnf install -y bzip2 >/dev/null 2>&1 || yum install -y bzip2
            cd /tmp
            curl -fLO https://github.com/aristocratos/btop/releases/download/v1.4.0/btop-aarch64-linux-musl.tbz && \
            tar -xf btop-aarch64-linux-musl.tbz && \
            cp btop/bin/btop /usr/local/bin/ && \
            btop --version || echo "WARN: btop install failed, continuing"

            echo "=== spot-metaphlan worker boot done at $(date) ==="

            --==BOUNDARY==--

# ---------------------------------------------------------------------------
# Launch Template — thin stock AMI, copies HUMAnN DB set from S3 (spot-humann)
# ---------------------------------------------------------------------------
# Same thin-AMI + S3-copy pattern as MetaphlanWorkerLaunchTemplate, but stages
# the four HUMAnN databases (~65 GiB) instead of vJan25. Copy runs SYNCHRONOUSLY
# so ECS registration is gated until all four prefixes are present:
#   1. install awscli v2 to /opt/conda-aws/bin (global aws.batch.cliPath).
#   2. aws s3 sync the four HUMAnN prefixes to /mnt/dbs/ (same dest paths the
#      baked AMI uses; conf/aws_batch.config reads them from /mnt/dbs/).
# NOTE: chocophlan_v4_alpha is ~30k small objects. We use `s3 sync` (not `cp`)
# and bump max_concurrent_requests so the object count (not byte count) doesn't
# dominate the copy. One copy per instance, amortized over every job on it.

  HumannWorkerLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub "${ProjectTag}-humann-worker"
      LaunchTemplateData:
        ImageId: !Ref ThinEcsAmiId
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              VolumeSize: 500          # ~65 GB HUMAnN DBs + retained humann_temp x up to 12 concurrent jobs (c8g.metal-48xl); 300 was too tight once --remove-temp-output was dropped
              VolumeType: gp3
              Iops: 12000              # higher than metaphlan's 9000 — the 30k-object chocophlan write is IOPS-bound
              Throughput: 1000         # gp3 max; default 125 MB/s pins the ~65 GiB boot-time HUMAnN DB sync
              DeleteOnTermination: true
              Encrypted: true
        UserData:
          Fn::Base64: !Sub |
            MIME-Version: 1.0
            Content-Type: multipart/mixed; boundary="==BOUNDARY=="

            --==BOUNDARY==
            Content-Type: text/x-shellscript; charset="us-ascii"

            #!/bin/bash
            exec > >(tee -a /var/log/nf-userdata.log) 2>&1
            set -x
            echo "=== spot-humann worker boot at $(date) ==="

            # 1. awscli v2 → /opt/conda-aws/bin/aws (global cliPath; bind-mounted
            #    grandparent /opt/conda-aws must exist for every container).
            AWS=/opt/conda-aws/bin/aws
            if [ ! -x "$AWS" ]; then
              echo "=== Installing awscli v2 to /opt/conda-aws ==="
              dnf install -y unzip >/dev/null 2>&1 || yum install -y unzip
              cd /tmp
              curl -sSL "https://awscli.amazonaws.com/awscli-exe-linux-aarch64.zip" -o awscliv2.zip
              unzip -q awscliv2.zip
              ./aws/install --install-dir /opt/conda-aws/aws-cli --bin-dir /opt/conda-aws/bin
              rm -rf awscliv2.zip aws
            fi
            "$AWS" --version || { echo "FATAL: awscli install failed" >&2; exit 1; }

            # 2. Copy the four HUMAnN DBs from S3 (SYNCHRONOUS — gates ECS
            # registration). Same single `s3 sync` + include-filter form the baked
            # AMI uses (infra/packer/worker-ami.pkr.hcl), scoped to vOct22 (not
            # vJan25). chocophlan = ~30k objects, so raise concurrency first
            # (object-count/latency bound, not throughput — this is what speeds
            # the small-object tail; the gp3 Throughput bump speeds the bulk files).
            "$AWS" configure set default.s3.max_concurrent_requests 128
            "$AWS" configure set default.s3.max_queue_size 10000
            mkdir -p /mnt/dbs
            echo "=== Syncing HUMAnN DBs from s3://${DbSourceBucket} -> /mnt/dbs ==="
            if ! time "$AWS" s3 sync "s3://${DbSourceBucket}/" /mnt/dbs/ \
                 --only-show-errors \
                 --exclude "*" \
                 --include "metaphlan_databases/vOct22/*" \
                 --include "chocophlan_v4_alpha/*" \
                 --include "uniref90_annotated_v4_alpha_ec_filtered/*" \
                 --include "full_mapping_v4_alpha/*"; then
              echo "FATAL: HUMAnN DB sync failed — worker will not be useful" >&2
              exit 1
            fi
            # Fail fast if any prefix landed empty (mirror baked-AMI validation).
            for d in chocophlan_v4_alpha full_mapping_v4_alpha \
                     uniref90_annotated_v4_alpha_ec_filtered \
                     metaphlan_databases/vOct22; do
              c=$(find "/mnt/dbs/$d" -type f 2>/dev/null | wc -l)
              echo "  $d: $c files"
              [ "$c" -gt 0 ] || { echo "FATAL: /mnt/dbs/$d empty" >&2; exit 1; }
            done
            echo "OK: HUMAnN DBs present ($(du -sh /mnt/dbs | cut -f1))"

            # 3. htop + btop (monitoring; non-essential, don't fail boot on them).
            echo "=== Installing htop + btop ==="
            dnf install -y htop bzip2 >/dev/null 2>&1 || yum install -y htop bzip2
            cd /tmp
            curl -fLO https://github.com/aristocratos/btop/releases/download/v1.4.0/btop-aarch64-linux-musl.tbz && \
            tar -xf btop-aarch64-linux-musl.tbz && \
            cp btop/bin/btop /usr/local/bin/ && \
            btop --version || echo "WARN: btop install failed, continuing"

            echo "=== spot-humann worker boot done at $(date) ==="

            --==BOUNDARY==--

# ---------------------------------------------------------------------------
# Compute Environments — Graviton (ARM64) only
# ---------------------------------------------------------------------------
# All containers in this pipeline publish multi-arch images (linux/arm64 + amd64).
# Graviton instances provide 20-40% better price/performance than x86 equivalents.
# AWS Batch automatically selects the ARM64 ECS-optimized AMI when ARM instance
# types are specified.
#
# spot-queue carries only the DB-free glue jobs (count_reads, clean_reads,
# combines, multiqc, SRA ingest); profile_taxa and profile_function route to the
# dedicated metal queues (spot-metaphlan / spot-humann). Glue is light
# (default cpus: 2 / memory: 4 GB = 2 GB/vCPU), so the memory-optimized r8g
# family (8 GB/vCPU) was dropped — c8g (2 GB/vCPU, cheapest exact fit) + m8g
# (4 GB/vCPU, headroom for fastp/fasterq-dump) cover it across 4 pools.
# TODO: right-size default cpus/memory from the cosmosid-infant trace
# (outdir/cosmosid-infant/reports/*_trace.txt — peak_rss/cpus columns) before
# the next big run. Current 2/4 is a first guess, not measured.

  # Primary: spot instances. SPOT_CAPACITY_OPTIMIZED selects the pool with the
  # deepest available capacity. Graviton 4 only — G2/G3 dropped for per-task
  # cost (see I25).
  SpotComputeEnvironment:
    Type: AWS::Batch::ComputeEnvironment
    Properties:
      Type: MANAGED
      State: ENABLED
      ComputeResources:
        Type: SPOT
        AllocationStrategy: SPOT_CAPACITY_OPTIMIZED
        BidPercentage: !Ref SpotBidPercentage
        MinvCpus: 0
        MaxvCpus: !Ref MaxvCPUsSpot
        InstanceRole: !GetAtt EcsInstanceProfile.Arn
        SpotIamFleetRole: !GetAtt SpotFleetRole.Arn
        InstanceTypes:
          # Graviton 4, c8g/m8g only — light glue jobs at 2 GB/vCPU. r8g dropped
          # (8 GB/vCPU mem-optimized = wasted on glue). 4 pools, 2 families.
          - m8g.2xlarge    # 8 vCPU / 32 GB
          - m8g.4xlarge    # 16 vCPU / 64 GB
          - c8g.2xlarge    # 8 vCPU / 16 GB
          - c8g.4xlarge    # 16 vCPU / 32 GB
        LaunchTemplate:
          LaunchTemplateId: !Ref BatchWorkerLaunchTemplate
          Version: $Latest
        Subnets: !Ref SubnetIds
        SecurityGroupIds:
          - !Ref BatchComputeSG
        Tags:
          Project: !Ref ProjectTag
          Environment: !Ref EnvironmentTag
      Tags:
        Project: !Ref ProjectTag
        Environment: !Ref EnvironmentTag

  # Fallback: on-demand Graviton instances — used when spot capacity unavailable.
  # Capped at MaxvCPUsOnDemand (default 64) as a cost safety net.
  OnDemandComputeEnvironment:
    Type: AWS::Batch::ComputeEnvironment
    Properties:
      Type: MANAGED
      State: ENABLED
      ComputeResources:
        Type: EC2
        AllocationStrategy: BEST_FIT_PROGRESSIVE
        MinvCpus: 0
        MaxvCpus: !Ref MaxvCPUsOnDemand
        InstanceRole: !GetAtt EcsInstanceProfile.Arn
        InstanceTypes:
          - m8g.2xlarge
          - m8g.4xlarge
          - c8g.2xlarge
          - c8g.4xlarge
        LaunchTemplate:
          LaunchTemplateId: !Ref BatchWorkerLaunchTemplate
          Version: $Latest
        Subnets: !Ref SubnetIds
        SecurityGroupIds:
          - !Ref BatchComputeSG
        Tags:
          Project: !Ref ProjectTag
          Environment: !Ref EnvironmentTag
      Tags:
        Project: !Ref ProjectTag
        Environment: !Ref EnvironmentTag

  # spot-metaphlan: dedicated spot CE for profile_taxa + StrainPhlAn. Thin AMI
  # that copies vJan25 from S3 at boot (see MetaphlanWorkerLaunchTemplate).
  # Spot-only — no on-demand fallback (these jobs just retry on reclaim).
  # Bare metal: r8g.metal-24xl (96 vCPU / 768 GB) measured <5% historical
  # interruption + 86% savings vs on-demand (infra/get_aws_spot_prices.py
  # --sort vcpu, pulls AWS's public Spot Advisor data) — cheapest $/vCPU of any
  # practical (non-exotic) Graviton type, likely because ARM sees little big-data
  # contention. One box fits 6 profile_taxa jobs (96 vCPU / 16 cpus each), all
  # sharing the single staged vJan25 copy on that instance.
  #
  # SPOT-POOL DEPTH: three 96-vCPU bare-metal pools (r8g/m8g/c8g .metal-24xl) so
  # SPOT_CAPACITY_OPTIMIZED has fallbacks if one pool goes dry (a single pool bit
  # us 2026-06-18: m8g/r8g .4xlarge pools went dry, workers reclaimed before
  # boot+copy finished). All three are 96 vCPU = 6 profile_taxa jobs/VM (16 cpus
  # each); they differ only in RAM (768/384/192 GB), all ample for the staged
  # vJan25 copy. r8g.metal-24xl stays the preferred pick on $/vCPU + interruption.
  SpotMetaphlanComputeEnvironment:
    Type: AWS::Batch::ComputeEnvironment
    Properties:
      Type: MANAGED
      State: ENABLED
      ComputeResources:
        Type: SPOT
        AllocationStrategy: SPOT_CAPACITY_OPTIMIZED
        BidPercentage: !Ref SpotBidPercentage
        MinvCpus: 0
        MaxvCpus: !Ref MaxvCPUsMetaphlan
        InstanceRole: !GetAtt EcsInstanceProfile.Arn
        SpotIamFleetRole: !GetAtt SpotFleetRole.Arn
        InstanceTypes:
          # NOTE: c8g.metal-48xl (192 vCPU) is INERT here while MaxvCPUsMetaphlan=100
          # — Batch won't launch an instance whose vCPUs exceed the cap (192 > 100).
          # Staged for if/when the metaphlan cap is raised; today only the 96-vCPU
          # types below can launch.
          - c8g.metal-48xl    # 192 vCPU / 384 GB bare metal — only usable if cap raised >192
          - r8g.metal-24xl    # 96 vCPU / 768 GB bare metal — 6 jobs/VM (16 cpus each)
          - m8g.metal-24xl    # 96 vCPU / 384 GB bare metal — extra spot-pool depth
          - c8g.metal-24xl    # 96 vCPU / 192 GB bare metal — extra spot-pool depth
        LaunchTemplate:
          LaunchTemplateId: !Ref MetaphlanWorkerLaunchTemplate
          Version: $Latest
        Subnets: !Ref SubnetIds
        SecurityGroupIds:
          - !Ref BatchComputeSG
        Tags:
          Project: !Ref ProjectTag
          Environment: !Ref EnvironmentTag
      Tags:
        Project: !Ref ProjectTag
        Environment: !Ref EnvironmentTag

  # spot-humann: dedicated spot CE for profile_function. Thin AMI that syncs the
  # HUMAnN DB set (~65 GiB) from S3 at boot (see HumannWorkerLaunchTemplate).
  # Spot-only — no on-demand fallback (jobs retry on reclaim; maxSpotAttempts=5).
  # Same three 96-vCPU bare-metal pools as spot-metaphlan for SPOT_CAPACITY_OPTIMIZED
  # depth; 16 cpus/job packs 6 jobs/VM, all sharing the single staged HUMAnN DB
  # copy on that instance.
  SpotHumannComputeEnvironment:
    Type: AWS::Batch::ComputeEnvironment
    Properties:
      Type: MANAGED
      State: ENABLED
      ComputeResources:
        Type: SPOT
        AllocationStrategy: SPOT_CAPACITY_OPTIMIZED
        BidPercentage: !Ref SpotBidPercentage
        MinvCpus: 0
        MaxvCpus: !Ref MaxvCPUsHumann
        InstanceRole: !GetAtt EcsInstanceProfile.Arn
        SpotIamFleetRole: !GetAtt SpotFleetRole.Arn
        InstanceTypes:
          - c8g.metal-48xl    # 192 vCPU / 384 GB bare metal — 12 HUMAnN jobs/VM (16 cpus each); best $/job at cap 600
          - r8g.metal-24xl    # 96 vCPU / 768 GB bare metal — 6 jobs/VM (16 cpus each)
          - m8g.metal-24xl    # 96 vCPU / 384 GB bare metal — extra spot-pool depth
          - c8g.metal-24xl    # 96 vCPU / 192 GB bare metal — extra spot-pool depth
        LaunchTemplate:
          LaunchTemplateId: !Ref HumannWorkerLaunchTemplate
          Version: $Latest
        Subnets: !Ref SubnetIds
        SecurityGroupIds:
          - !Ref BatchComputeSG
        Tags:
          Project: !Ref ProjectTag
          Environment: !Ref EnvironmentTag
      Tags:
        Project: !Ref ProjectTag
        Environment: !Ref EnvironmentTag

# ---------------------------------------------------------------------------
# Job Queue
# ---------------------------------------------------------------------------

  # Named exactly "spot-queue" to match conf/aws_batch.config — no config changes needed.
  # Spot CE has priority 1 (tried first); on-demand CE has priority 2 (transparent fallback).
  SpotQueue:
    Type: AWS::Batch::JobQueue
    Properties:
      JobQueueName: spot-queue
      State: ENABLED
      Priority: 100
      ComputeEnvironmentOrder:
        - Order: 1
          ComputeEnvironment: !Ref SpotComputeEnvironment
        - Order: 2
          ComputeEnvironment: !Ref OnDemandComputeEnvironment
      Tags:
        Project: !Ref ProjectTag
        Environment: !Ref EnvironmentTag

  # spot-metaphlan: profile_taxa + StrainPhlAn jobs (routed via conf/aws_batch.config).
  # Spot-only — single CE, no on-demand fallback.
  MetaphlanQueue:
    Type: AWS::Batch::JobQueue
    Properties:
      JobQueueName: spot-metaphlan
      State: ENABLED
      Priority: 100
      ComputeEnvironmentOrder:
        - Order: 1
          ComputeEnvironment: !Ref SpotMetaphlanComputeEnvironment
      Tags:
        Project: !Ref ProjectTag
        Environment: !Ref EnvironmentTag

  # spot-humann: profile_function jobs (routed via conf/aws_batch.config).
  # Spot-only — single CE, no on-demand fallback.
  HumannQueue:
    Type: AWS::Batch::JobQueue
    Properties:
      JobQueueName: spot-humann
      State: ENABLED
      Priority: 100
      ComputeEnvironmentOrder:
        - Order: 1
          ComputeEnvironment: !Ref SpotHumannComputeEnvironment
      Tags:
        Project: !Ref ProjectTag
        Environment: !Ref EnvironmentTag

# ---------------------------------------------------------------------------
# CloudWatch Logs
# ---------------------------------------------------------------------------

  BatchLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/batch/nf-reads-profiler
      RetentionInDays: 30
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Environment
          Value: !Ref EnvironmentTag

# ---------------------------------------------------------------------------
# Outputs
# ---------------------------------------------------------------------------

Outputs:
  SpotQueueArn:
    Description: ARN of the spot-queue job queue (referenced by Nextflow aws_batch.config)
    Value: !GetAtt SpotQueue.JobQueueArn
    Export:
      Name: !Sub "${AWS::StackName}-SpotQueueArn"

  MetaphlanQueueArn:
    Description: ARN of the spot-metaphlan job queue (profile_taxa + StrainPhlAn)
    Value: !GetAtt MetaphlanQueue.JobQueueArn
    Export:
      Name: !Sub "${AWS::StackName}-MetaphlanQueueArn"

  HumannQueueArn:
    Description: ARN of the spot-humann job queue (profile_function)
    Value: !GetAtt HumannQueue.JobQueueArn
    Export:
      Name: !Sub "${AWS::StackName}-HumannQueueArn"

  BatchJobRoleArn:
    Description: >
      ARN of the ECS task role for Batch jobs. Add to conf/aws_batch.config:
      aws { batch { jobRole = '<this value>' } }
    Value: !GetAtt BatchJobRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-BatchJobRoleArn"

  NextflowRunnerPolicyArn:
    Description: >
      Attach this managed policy to the IAM role of your EC2 Nextflow runner VM.
      Command: aws iam attach-role-policy --role-name <runner-role> --policy-arn <this-value>
    Value: !Ref NextflowRunnerPolicy
    Export:
      Name: !Sub "${AWS::StackName}-NextflowRunnerPolicyArn"

  WorkDirBucket:
    Description: S3 bucket for Nextflow work directory (set as workDir in aws_batch.config)
    Value: !Ref S3WorkDirBucket
    Export:
      Name: !Sub "${AWS::StackName}-WorkDirBucket"

  # DashboardUrl moved to infra/monitoring-stack.yaml (split out at the 51 KB
  # inline-template limit). The dashboard name is unchanged (${ProjectTag}-batch).

  BatchConsoleUrl:
    Description: AWS Batch console — view job queues, compute environments, and running jobs
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/batch/home?region=${AWS::Region}#/queues"

  LogGroupName:
    Description: CloudWatch log group for all Batch job logs
    Value: /aws/batch/nf-reads-profiler
